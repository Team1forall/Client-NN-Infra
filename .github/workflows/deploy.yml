# Deploys the site to Vercel on every push.
#
# Vercel's own Git integration would normally do this, but it requires a GitHub
# login connection on the Vercel account (Settings -> Authentication). This
# workflow does the same job through the Vercel CLI and a token, so it works
# without that connection. If the connection is added later, delete this file
# and run `vercel git connect` instead — running both would deploy twice.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       https://vercel.com/account/settings/tokens
#   VERCEL_ORG_ID      the "orgId" in .vercel/project.json
#   VERCEL_PROJECT_ID  the "projectId" in .vercel/project.json
#
# master -> production. Pull requests -> a preview URL posted in the job summary.
#
# Environment variables (GOOGLE_SHEETS_WEBHOOK_URL / _SECRET) are not kept here:
# `vercel pull` fetches them from the project, so the Sheets integration is
# configured in one place only.

name: Deploy

on:
  push:
    branches: ["master"]
  pull_request:

# A newer push to the same branch makes an in-flight deploy pointless.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The CLI reads this directly, so the token never appears on a command
      # line (and so in the runner's process list).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reuse Next.js's compiler cache between runs; see the Next.js CI build
      # caching guide. Keyed on lockfile + sources so it rebuilds when either moves.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Vercel CLI
        run: npm install --global vercel@65

      # Fails fast, and with a readable message, if VERCEL_TOKEN is missing or
      # malformed -- and records which account CI deploys as.
      - name: Verify Vercel auth
        run: vercel whoami

      # Production on master, preview everywhere else.
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull project settings and environment variables
        run: vercel pull --yes --environment=${{ steps.target.outputs.environment }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ steps.target.outputs.environment }} to $url" >> "$GITHUB_STEP_SUMMARY"

      # A deploy that 500s still "succeeds" as a CLI call; check the page renders.
      # Production only: preview URLs sit behind Vercel Authentication and answer 401.
      - name: Smoke test
        if: steps.target.outputs.environment == 'production'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$url/")
          echo "GET $url/ -> $code"
          test "$code" = "200"
